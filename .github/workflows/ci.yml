name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 테스트 컨텍스트 로딩용 더미 값입니다. 실제 비밀값이 아닙니다.
    env:
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      KAKAO_CLIENT_ID: ci-dummy
      KAKAO_CLIENT_SECRET: ci-dummy
      JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # test → jacocoTestReport → jacocoTestCoverageVerification
      # 서비스 클래스 중 하나라도 라인 커버리지가 80% 미만이면 실패합니다.
      # Testcontainers는 러너에 기본 설치된 Docker를 사용합니다.
      - name: Test with coverage check
        run: ./gradlew check

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 7

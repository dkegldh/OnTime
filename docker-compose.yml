services:
  postgres:
    image: postgres:18
    container_name: ontime-postgres
    environment:
      POSTGRES_DB: ontime
      POSTGRES_USER: ontime
      POSTGRES_PASSWORD: ontime
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:7.4
    container_name: ontime-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: